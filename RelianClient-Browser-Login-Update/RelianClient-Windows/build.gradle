plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.1'
}

group = 'com.relian'
version = '0.1.0'

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'com.relian.launcher.RelianLauncher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jlink {
    options = ['--add-modules', 'jdk.httpserver,java.desktop', '--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher { name = 'RelianClient' }
    jpackage {
        imageName = 'RelianClient'
        installerName = 'RelianClient'
        installerType = 'exe'
        appVersion = '0.1.0'
        vendor = 'Relian Client'
        installerOptions = ['--win-menu', '--win-shortcut']
    }
}
