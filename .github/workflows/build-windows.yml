name: Build Relian Client for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: relian-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs: build-fabric-runtime
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download bundled Fabric HUD runtime
        uses: actions/download-artifact@v4
        with:
          name: RelianClient-Fabric-1.21.1
          path: RelianClient-Browser-Login-Update/RelianClient-Windows/src/main/resources/client-runtime

      - name: Name bundled HUD runtime
        shell: pwsh
        run: |
          $source = Get-ChildItem 'RelianClient-Browser-Login-Update/RelianClient-Windows/src/main/resources/client-runtime' -Filter '*-0.1.0.jar' | Select-Object -First 1
          if (-not $source) { throw 'The Fabric HUD runtime JAR was not found in the downloaded artifact.' }
          Copy-Item $source.FullName 'RelianClient-Browser-Login-Update/RelianClient-Windows/src/main/resources/client-runtime/RelianClient-Fabric-1.21.1.jar' -Force

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows installer
        working-directory: RelianClient-Browser-Login-Update/RelianClient-Windows
        run: gradle --project-prop=relian.minecraft.integration=true test jpackage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RelianClient-Windows-Installer
          path: RelianClient-Browser-Login-Update/RelianClient-Windows/build/jpackage/*.exe
          if-no-files-found: error

  build-fabric-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fabric HUD runtime
        working-directory: relian-client-fabric
        run: gradle build
      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: RelianClient-Fabric-1.21.1
          path: relian-client-fabric/build/libs/*-0.1.0.jar
          if-no-files-found: error
