name: Build Relian Client for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: relian-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows installer
        working-directory: RelianClient-Browser-Login-Update/RelianClient-Windows
        run: gradle jpackage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RelianClient-Windows-Installer
          path: RelianClient-Browser-Login-Update/RelianClient-Windows/build/jpackage/*.exe
          if-no-files-found: error

  build-fabric-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fabric HUD runtime
        working-directory: relian-client-fabric
        run: gradle build
      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: RelianClient-Fabric-1.21.1
          path: relian-client-fabric/build/libs/*.jar
          if-no-files-found: error
